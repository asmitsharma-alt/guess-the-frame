services:
  # Backend API & Realtime WebSockets Service
  - type: web
    name: guess-the-frame-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: guess-the-frame-db
          property: connectionString

  # Frontend Static SPA Site
  - type: web
    name: guess-the-frame-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: react-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /GUESSTHEFRAME/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /GUESSTHEEYES/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /avvtar/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: guess-the-frame-db
    plan: free
    databaseName: guesstheframe
    user: guesstheframe_admin
    region: oregon
